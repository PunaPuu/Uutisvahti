<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Uutisvahti</title>
  <meta name="description" content="Azure, Microsoft 365 and Copilot news from Microsoft's official feeds, updated every hour.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Uutisvahti">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#list">Skip to stories</a>

  <header class="top">
    <div class="titlebar">
      <h1>Uutisvahti</h1>
      <p class="updated" id="updated" aria-live="polite">Loading…</p>
    </div>
    <nav class="tabs" aria-label="View">
      <button type="button" class="tab" data-view="all" aria-pressed="true">All</button>
      <button type="button" class="tab" data-view="unread" aria-pressed="false">Unread <span class="count" id="unread-count"></span></button>
      <button type="button" class="tab" data-view="saved" aria-pressed="false">Saved <span class="count" id="saved-count"></span></button>
    </nav>
  </header>

  <section class="controls" aria-label="Search and filters">
    <p class="tagline">Azure, Microsoft 365 and Copilot news from Microsoft's official feeds, updated every hour.</p>
    <div class="search">
      <label class="visually-hidden" for="q">Search news</label>
      <input id="q" type="search" placeholder="Search titles, summaries, services" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="filter-group">
      <span class="group-label" id="product-label">Product</span>
      <div class="chips" id="product-chips" role="group" aria-labelledby="product-label"></div>
    </div>
    <div class="filter-group">
      <span class="group-label" id="status-label">Status</span>
      <div class="chips" id="status-chips" role="group" aria-labelledby="status-label"></div>
    </div>
  </section>

  <main id="main">
    <p class="notice" id="notice" hidden></p>
    <div class="resultbar" id="resultbar">
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <button type="button" class="link-button" id="clear" hidden>Clear filters</button>
    </div>
    <div id="list" tabindex="-1"><p class="loading">Loading news…</p></div>
    <button type="button" class="more" id="more" hidden>Show more</button>
    <div class="empty" id="empty" hidden>
      <p id="empty-text"></p>
      <button type="button" class="link-button" id="empty-clear" hidden>Clear filters</button>
    </div>
    <p class="end" id="end" hidden></p>
  </main>

  <footer class="foot">
    <button type="button" class="link-button" id="mark-all" hidden></button>
    <p id="sources"></p>
    <p>No cookies or tracking. Read and saved marks stay in this browser only. Hosted on GitHub Pages.</p>
  </footer>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="link-button" id="toast-undo">Undo</button>
  </div>
</body>
</html>
